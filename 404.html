<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mahesh Designers — Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Segment count for GitHub Pages subfolder (0 for custom domain or username.github.io, 1 for username.github.io/repo-name)
      var pathSegmentsToKeep = 0;

      var l = window.location;
      // If path has repository name, check if pathname segments > 1
      var pathname = l.pathname;
      var segments = pathname.split('/').filter(Boolean);
      // Auto-detect if deployed under a repo subfolder
      if (l.hostname.endsWith('github.io') && segments.length > 0 && !l.hostname.startsWith(segments[0])) {
        pathSegmentsToKeep = 1;
      }

      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Mahesh Designers catalog...</p>
  </body>
</html>
